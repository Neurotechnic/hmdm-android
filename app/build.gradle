apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.hmdm.launcher"
        //minSdkVersion 16
        // Starting with version 6.33, we use newer version of com.fasterxml.jackson
        // which is only compatible with API 26 (Android 8+).
        // To avoid failures after the upgrade, the minimal SDK version increased here.
        // If it is required to maintain the backward compatibility with Android 5-7,
        // downgrade the dependency to com.fasterxml.jackson to 2.13.5
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 15401
        versionName "6.40_custom1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        dataBinding {
            enabled = true
        }

        buildFeatures {
            aidl true
            buildConfig = true
        }

        namespace 'com.hmdm.launcher'
        multiDexEnabled true

        buildConfigField("String", "BASE_URL", "\"https://app.h-mdm.com\"")
        buildConfigField("String", "SECONDARY_BASE_URL", "\"https://app.h-mdm.com\"")
        buildConfigField("String", "SERVER_PROJECT", "\"\"")
        buildConfigField("String", "DEVICE_ID_CHOICE", "\"user\"")
        // Configuration key from the enrollment JSON (String)
        buildConfigField("String", "ENROLLMENT_CONFIG_KEY", "null")
        // ID of the customer enrolling devices (in multi-tenant setup only)
        buildConfigField("String", "ENROLLMENT_CUSTOMER", "null")
        // Device group IDs (optional, comma-separated ids)
        buildConfigField("String", "ENROLLMENT_GROUPS", "null")
        // MQTT port for Push notifications
        buildConfigField("Integer", "MQTT_PORT", "31000")
        buildConfigField("Boolean", "SYSTEM_PRIVILEGES", "false")
        // If set to true, Headwind MDM prompts the user to reboot a device if failed to set the
        // device owner. This could be used together with the SYSTEM_PRIVILEGES option
        buildConfigField("Boolean", "REBOOT_ON_DEVICE_OWNER_FAIL", "false")
        // Set this parameter to true if you'd like to trust every certificate, for example, self-signed
        // Not recommended for security purposes!
        buildConfigField("Boolean", "TRUST_ANY_CERTIFICATE", "false")
        buildConfigField("String", "REQUEST_SIGNATURE", "\"changeme-C3z9vi54\"")
        buildConfigField("Boolean", "CHECK_SIGNATURE", "false")
        buildConfigField("Boolean", "ANR_WATCHDOG", "false")
        buildConfigField("Boolean", "REQUEST_SERVER_URL", "true")
        buildConfigField("Boolean", "DEVICE_ADMIN_DEBUG", "false")
        buildConfigField("Boolean", "ENABLE_KIOSK_WITHOUT_OVERLAYS", "false")
        buildConfigField("Boolean", "MQTT_SERVICE_FOREGROUND", "true")
        buildConfigField("Boolean", "SET_DEFAULT_LAUNCHER_EARLY", "false")
        buildConfigField("Boolean", "SELECTED_ITEM_BY_CLICK", "false")
        buildConfigField("Boolean", "DISABLE_ORIENTATION_LOCK", "false")
        buildConfigField("String", "LIBRARY_API_KEY", "\"changeme-8gzk321W\"")
        buildConfigField("Boolean", "USE_ACCESSIBILITY", "false")
    }

    signingConfigs {
        release {
            def storeFilePath = localProperties.getProperty("RELEASE_STORE_FILE")
            def storePasswordValue = localProperties.getProperty("RELEASE_STORE_PASSWORD")
            def keyAliasValue = localProperties.getProperty("RELEASE_KEY_ALIAS")
            def keyPasswordValue = localProperties.getProperty("RELEASE_KEY_PASSWORD")

            def passwordFile = localProperties.getProperty("RELEASE_PASSWORD_FILE")
            if (passwordFile) {
                storePasswordValue = file(passwordFile).readLines("UTF-8").first()
                keyPasswordValue = storePasswordValue
            }

            if (storeFilePath != null && storePasswordValue != null && keyAliasValue != null && keyPasswordValue != null) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable false
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
    }

    flavorDimensions "all"

    productFlavors {
        opensource { }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.appcompat:appcompat:1.1.0'
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'

    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.0'

    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.jakewharton.picasso:picasso2-okhttp3-downloader:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-jackson:3.0.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.21'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.1'

    implementation 'androidx.work:work-runtime:2.9.1'

    implementation('com.journeyapps:zxing-android-embedded:4.1.0') {
        transitive = false
    }

    implementation 'com.google.zxing:core:3.3.0'
    implementation group: 'commons-io', name: 'commons-io', version: '2.0.1'

    implementation "jakarta.xml.bind:jakarta.xml.bind-api:2.3.2"
    implementation "org.glassfish.jaxb:jaxb-runtime:2.3.2"
}